<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>骰子投擲與效能驗證</title>
<style>body{margin:0}#checks{position:fixed;z-index:10000;top:0;left:0;display:flex;gap:6px;background:white;color:#111;padding:5px;font:13px sans-serif}#metrics{position:fixed;top:36px;left:8px;z-index:10000;max-width:650px;white-space:pre-wrap;background:#fffffff0;color:#111;font:12px monospace;pointer-events:none}</style>
<div id="checks"><select id="lord"><option value="liu">劉備</option><option value="cao">曹操</option><option value="sun">孫權</option><option value="dong">董卓</option></select><button id="one">一顆</button><button id="two">兩顆</button><button id="three">三顆</button><button id="repeat">三骰連續測試</button><button id="hide">顯示／隱藏數據</button><button id="clear">清除骰子</button><span id="status">準備中</span></div><pre id="metrics"></pre>
<div id="scene"></div><div id="ui"></div>
<script type="module">
import '/src/style.css';
import {Game} from '/src/game/Game.ts';
import {createGameState} from '/src/game/GameState.ts';
import {installUiViewport} from '/src/ui/UiViewport.ts';
const status=document.querySelector('#status'),output=document.querySelector('#metrics');
installUiViewport(document.querySelector('#ui'));
const game=new Game(document.querySelector('#scene'),document.querySelector('#ui'));
// One fixed scene and viewport for before/after comparisons; no real room is joined.
let seed=73491;const original=Math.random;Math.random=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/0x100000000);const state=createGameState('liu');Math.random=original;
const longTasks=[];try{new PerformanceObserver(list=>longTasks.push(...list.getEntries().map(e=>({start:e.startTime,duration:e.duration})))).observe({type:'longtask',buffered:true});}catch{}
const timings={};
function instrument(name,renderer){if(!renderer||timings[name])return;const raw=renderer.render.bind(renderer);timings[name]=[];renderer.render=(...args)=>{const start=performance.now();raw(...args);timings[name].push(performance.now()-start);};}
const summarize=a=>{a=[...a].sort((x,y)=>x-y);return {samples:a.length,p50:+(a[Math.floor(a.length*.5)]??0).toFixed(2),p95:+(a[Math.floor(a.length*.95)]??0).toFixed(2),max:+(a.at(-1)??0).toFixed(2)};};
async function roll(count,hold=true){status.textContent='投擲中';game.ui.dice.cancel();const lord=document.querySelector('#lord').value;game.ui.actors.focus(lord,true);await game.ui.actors.preparing;await new Promise(r=>setTimeout(r,1400));instrument('map',game.sm.renderer);instrument('actors',game.ui.actors.renderer);instrument('dice',game.ui.dice.renderer);for(const a of Object.values(timings))a.length=0;const frames=[],start=performance.now();let running=true,last=start;const tick=now=>{if(!running)return;frames.push(now-last);last=now;requestAnimationFrame(tick);};requestAnimationFrame(tick);let releasedAt,readyAt,visibleDice=0;const stage=document.querySelector('.dice-roll-stage');const observer=new MutationObserver(()=>{visibleDice=Math.max(visibleDice,game.ui.dice.dice.length);if(releasedAt&&['hand-release','large-descent'].includes(stage.dataset.sequencePhase)&&!readyAt)readyAt=performance.now();});observer.observe(stage,{attributes:true});let failures=[];const warn=console.warn;console.warn=(...args)=>{failures.push(args.map(String).join(' '));warn(...args);};try{const values=Array.from({length:count},(_,i)=>i+2),prepared=game.ui.dice.prepareRoll(values);await prepared;await game.ui.actors.playRoll(lord,origin=>{releasedAt=performance.now();return game.ui.dice.roll(values,0,1,1,hold,origin,prepared);});}finally{console.warn=warn;running=false;observer.disconnect();}const report={count,lord,viewport:[innerWidth,innerHeight,devicePixelRatio],totalMs:Math.round(performance.now()-start),releaseGapMs:Math.round((readyAt??performance.now())-(releasedAt??start)),frameMs:summarize(frames),renderMs:Object.fromEntries(Object.entries(timings).map(([key,a])=>[key,summarize(a)])),longTasks:longTasks.filter(e=>e.start>=start),map:game.sm.renderer.info.render,dice:game.ui.dice.renderer?.info.render,textures:game.ui.dice.renderer?.info.memory.textures,visibleDice,physics:stage.dataset.physics,failures};output.textContent=JSON.stringify(report,null,2);status.textContent=`完成 ${count} 顆・實際 ${report.visibleDice} 顆・錯誤 ${failures.length}`;return report;}
document.querySelector('#one').onclick=()=>roll(1);document.querySelector('#two').onclick=()=>roll(2);document.querySelector('#three').onclick=()=>roll(3);document.querySelector('#repeat').onclick=async()=>{const reports=[];for(let i=0;i<5;i++)reports.push(await roll(3,false));output.textContent=JSON.stringify(reports,null,2);};document.querySelector('#hide').onclick=()=>{output.hidden=!output.hidden;};document.querySelector('#clear').onclick=()=>{game.ui.dice.cancel();output.textContent='';};
try{await game.prepare(()=>{});game.startOnline(state,'liu',()=>{});await game.ui.preloadDeferredAssets();status.textContent='可測試';}catch(e){status.textContent=String(e);}
</script></html>
