<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 款修仙底座原畫</title><style>
*{box-sizing:border-box}body{margin:0;background:#14252a;color:#f2ead4;font-family:"Microsoft JhengHei",serif}header{max-width:1240px;margin:auto;padding:34px 24px 25px}h1{font-size:28px;margin:0 0 12px}p{line-height:1.7;color:#c1d3cd;margin:5px 0}a{color:#dfecc5}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:1240px;margin:auto;padding:0 24px 30px}.design{border:1px solid #617a7044;background:#20373b;border-radius:16px;overflow:hidden}.design h2{font-size:19px;font-weight:500;padding:16px 20px 0;margin:0}.design .art{height:350px;display:flex;align-items:center;justify-content:center;padding:10px 20px;background:radial-gradient(ellipse at 50% 65%,#52695e88,transparent 70%)}.design img{display:block;width:100%;height:100%;object-fit:contain}.design .links{padding:0 20px 18px;display:flex;justify-content:space-between;align-items:center;color:#b7c9c0;font-size:13px}.light{background:#dfdfd1;color:#203b3a}.light p{color:#415a51}.light .design{background:#f1efdf}.light a{color:#245d5a}button{background:#dbe6c8;border:0;border-radius:7px;padding:9px 15px;font:inherit;color:#254c3d;cursor:pointer}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px}@media(max-width:720px){main{grid-template-columns:1fr;padding:0 14px 24px}.design .art{height:320px}header{padding:25px 16px}.design h2{font-size:18px}}
</style></head><body><header><h1>10 款全新修仙底座原畫</h1><p>這次先看底座本體，不放人物、數字或舊資訊框。上面留坐姿平面，正面留資訊位置；選定後再配合主公代表色與遊戲尺寸精修。</p><p>已選擇 03「懸浮仙峰」；已重新繪製加高的白石留字面，並以四列大字套用到本機遊戲。其他原畫保留供比較。</p><nav><button id="background">切換淺色背景</button><a href="./lord-dice-sequence-preview.html" target="_blank">查看離手立即接中央落骰</a><a href="./?lord=liu&rounds=endless" target="_blank">本機遊戲</a></nav></header><main id="designs"></main><script type="module">
const names=['青玉山石','白玉蓮臺','懸浮仙峰','靈竹木墩','古銅鼎座','天書卷座','冰魄晶臺','玄鐵星臺','盤根靈木','雲海仙舟'];
const root=document.querySelector('#designs');for(const [i,name] of names.entries()){const id=String(i+1).padStart(2,'0');const item=document.createElement('article');item.className='design';item.innerHTML=`<h2>${id} · ${name}${id==='03'?' ✓ 已選用':''}</h2><a class="art" href="./art/lord-base-images-r5/${id==='03'?'03-tall':id}.webp" target="_blank"><img src="./art/lord-base-images-r5/${id==='03'?'03-tall':id}.webp" alt="${id} ${name} 底座原畫"></a><div class="links"><span>獨立透明底圖</span><a href="./art/lord-base-images-r5/${id==='03'?'03-tall':id}.webp" download="底座-${id==='03'?'03-tall':id}.webp">下載圖片</a></div>`;root.append(item);}
try{localStorage.removeItem('lord-hud-style')}catch{}
document.querySelector('#background').onclick=()=>{const light=document.body.classList.toggle('light');document.querySelector('#background').textContent=light?'切換深色背景':'切換淺色背景';};
</script></body></html>
